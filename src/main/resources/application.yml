spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: https://user-service.orangebay-0b927206.eastus.azurecontainerapps.io
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user/(?<segment>.*), /api/${segment}

        - id: scheduling-service
          uri: http://52.6.97.237:8082
          predicates:
            - Path=/api/sessions,/api/sessions/**
          filters:
            - RewritePath=/api/sessions(?<segment>/?.*), /sessions${segment}

        - id: offer-service
          uri: https://offer-service.orangebay-0b927206.eastus.azurecontainerapps.io
          predicates:
            - Path=/api/offers/**

        - id: video-service-chat-api
          uri: https://videochat-sfu-git-04071730.azurewebsites.net
          predicates:
            - Path=/api/chat/**

        - id: video-service-socket
          uri: wss://videochat-sfu-git-04071730.azurewebsites.net
          predicates:
            - Path=/socket.io/**

server:
  port: 8080

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
