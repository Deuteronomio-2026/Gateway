spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: https://user-service.orangebay-0b927206.eastus.azurecontainerapps.io
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user/(?<segment>.*), /api/${segment}

        - id: scheduling-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/sessions/**

        - id: video-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/video/**

        - id: offer-service
          uri: https://offer-service.orangebay-0b927206.eastus.azurecontainerapps.io
          predicates:
            - Path=/api/offers/**

server:
  port: 8080

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway